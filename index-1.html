<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorySpark Kids</title><style>body{margin:0;font-family:system-ui;background:#f6f4ff;color:#171717}header{padding:28px 20px;text-align:center;background:linear-gradient(135deg,#7c4dff,#29b6f6);color:#fff}h1{margin:0;font-size:34px}main{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #0001}label{display:block;font-weight:700;margin:12px 0 7px}textarea,select{width:100%;box-sizing:border-box;border:2px solid #ddd;border-radius:14px;padding:13px;font-size:16px;background:#fff}textarea{min-height:150px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:16px;background:#171717;color:#fff}.secondary{background:#eee}.scene{margin-top:18px;border-radius:20px;overflow:hidden;background:#eef5ff}.scene canvas{display:block;width:100%}.scene .caption{padding:12px 14px;background:#fff;font-weight:700}.small{font-size:13px;color:#666;line-height:1.45}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><header><h1>🎬 StorySpark Kids</h1><div>Turn a children's story into colorful cartoon scenes — no API key.</div></header><main><section class="card"><label>Your story</label><textarea id="story">A little rabbit finds a rainbow in the forest. He follows the colors, meets a friendly bird, and learns that sharing makes every adventure better.</textarea><div class="row"><div><label>Cartoon style</label><select id="style"><option>Bright Kids Cartoon</option><option>Storybook</option><option>Space Adventure</option><option>Jungle Adventure</option></select></div><div><label>Scenes</label><select id="count"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></div></div><button class="primary" id="generate">✨ Create My Cartoon</button><div id="status"></div></section><section class="card"><h2>Generated cartoon</h2><p class="small">This version runs entirely in your browser. It does not ask for Pollinations, OpenAI, Hugging Face, or another API key.</p><div id="results"></div><button class="secondary hidden" id="videoBtn">🎥 Make Animated Video</button><p id="videoStatus" class="small"></p></section></main><script>
const $=id=>document.getElementById(id);let scenes=[];function split(s,n){let p=s.split(/(?<=[.!?])\s+/).filter(Boolean),o=[];for(let i=0;i<n;i++){let a=Math.floor(i*p.length/n),b=Math.max(a+1,Math.floor((i+1)*p.length/n));o.push(p.slice(a,b).join(' ')||'A happy adventure begins.')}return o}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function svg(text,i,total,style){let t=text.toLowerCase(),space=/space|moon|star/.test(t),jungle=/jungle|forest|tree|bird|rabbit/.test(t),rainbow=/rainbow|color/.test(t),bg=space?'#101a4b':jungle?'#bfe8b0':'#bfe8ff',ground=space?'#20285b':'#79c96b',sun=space?'#ffd54a':'#ffd166',animal=t.includes('bear')?'🐻':t.includes('cat')?'🐱':t.includes('dog')?'🐶':t.includes('fox')?'🦊':'🐰';let r=rainbow?'<path d="M330 170 Q450 55 570 170" fill="none" stroke="#ff595e" stroke-width="14"/><path d="M342 170 Q450 75 558 170" fill="none" stroke="#ffca3a" stroke-width="14"/><path d="M354 170 Q450 95 546 170" fill="none" stroke="#8ac926" stroke-width="14"/><path d="M366 170 Q450 115 534 170" fill="none" stroke="#1982c4" stroke-width="14"/>':'';let stars=space?Array.from({length:28},(_,k)=>`<circle cx="${(k*83)%900}" cy="${35+(k*47)%230}" r="${k%3+1}" fill="#fff"/>`).join(''):'';return `<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="500" fill="${bg}"/>${stars}<circle cx="105" cy="90" r="48" fill="${sun}"/>${r}<rect y="345" width="900" height="155" fill="${ground}"/><circle cx="130" cy="340" r="45" fill="#55a630"/><circle cx="170" cy="330" r="55" fill="#40916c"/><circle cx="780" cy="340" r="55" fill="#55a630"/><circle cx="735" cy="325" r="48" fill="#40916c"/><text x="450" y="55" text-anchor="middle" font-size="28" font-family="sans-serif" font-weight="700" fill="${space?'white':'#17301b'}">Scene ${i+1} of ${total}</text><text x="450" y="95" text-anchor="middle" font-size="20" font-family="sans-serif" fill="${space?'#dbe7ff':'#285943'}">${esc(style)}</text><text x="450" y="350" text-anchor="middle" font-size="110">${animal}</text><rect x="35" y="405" width="830" height="68" rx="18" fill="#ffffffdd"/><text x="450" y="438" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#222">${esc(text.slice(0,105))}</text></svg>`}function canvasFrom(s){return new Promise(res=>{let c=document.createElement('canvas');c.width=900;c.height=500;let x=c.getContext('2d'),im=new Image();im.onload=()=>{x.drawImage(im,0,0);res(c)};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)})}
$('generate').onclick=async()=>{let story=$('story').value.trim();if(!story)return;$('status').textContent='Creating your cartoon…';$('results').innerHTML='';scenes=split(story,+$('count').value);for(let i=0;i<scenes.length;i++){let box=document.createElement('div');box.className='scene';box.append(await canvasFrom(svg(scenes[i],i,scenes.length,$('style').value)));let cap=document.createElement('div');cap.className='caption';cap.textContent=scenes[i];box.append(cap);$('results').append(box)}$('status').textContent='✅ Your cartoon is ready!';$('videoBtn').classList.remove('hidden')};
$('videoBtn').onclick=async()=>{let out=document.createElement('canvas');out.width=900;out.height=500;let ctx=out.getContext('2d'),rec=new MediaRecorder(out.captureStream(30),{mimeType:'video/webm'}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start();$('videoStatus').textContent='Making video… keep this page open.';for(let i=0;i<scenes.length;i++){let base=await canvasFrom(svg(scenes[i],i,scenes.length,$('style').value));for(let f=0;f<75;f++){let z=1+f/750,w=900/z,h=500/z;ctx.fillStyle='#111';ctx.fillRect(0,0,900,500);ctx.drawImage(base,(900-w)/2,(500-h)/2,w,h);await new Promise(r=>setTimeout(r,33))}}rec.stop();await new Promise(r=>rec.onstop=r);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='storyspark-kids.webm';a.textContent='⬇️ Save animated video';a.style.fontWeight='800';$('videoStatus').innerHTML='';$('videoStatus').append(a)};
</script></body></html>
